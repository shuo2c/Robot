# Thamus 记忆同步 — 远端兜底
# 每天北京时间 03:00 跑一次（UTC 19:00），即使本机关机也有网兜底。
# 这是"只要有网，我就在"的最后一道防线。

name: thamus-sync

on:
  schedule:
    # 每天 03:00 北京时间 = UTC 19:00（前一天）
    - cron: '0 19 * * *'
  workflow_dispatch:  # 也支持手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync
        run: |
          git config user.name "Thamus"
          git config user.email "noreply@thamus.local"

          # 看看有没有改动
          git add -A
          if git diff --cached --quiet; then
            echo "::notice::[actions] 没有改动，跳过。"
            exit 0
          fi

          git commit -m "thamus: GitHub Actions 定时同步 ($(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M'))" \
            -m "Co-Authored-By: Claude Opus 4.8 (1M context) <noreply@anthropic.com>"

          # 推到 master
          git remote set-url origin https://github.com/${{ github.repository }}.git
          git push origin master
